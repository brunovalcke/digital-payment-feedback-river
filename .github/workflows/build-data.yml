name: Build feedback data
on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
    - cron: "30 6 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build public artifact
        env:
          MEDALLIA_API_URL: ${{ secrets.MEDALLIA_API_URL }}
          MEDALLIA_API_TOKEN: ${{ secrets.MEDALLIA_API_TOKEN }}
          ANONYMIZATION_SALT: ${{ secrets.ANONYMIZATION_SALT }}
        run: PYTHONPATH=. python scripts/build_public_data.py
      - name: Commit refreshed artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "chore: refresh public feedback data"
          git push
